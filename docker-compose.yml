services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tokenhub]
    ports: ["127.0.0.1:8080:8080"]
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tokenhub}
      MYSQL_USER: ${DB_USERNAME:-tokenhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tokenhub]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [tokenhub]
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    profiles: [gateway]
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]
    networks: [tokenhub]
volumes:
  mysql_data:
  redis_data:
networks:
  tokenhub:
